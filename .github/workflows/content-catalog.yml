name: Content Catalog

on:
  push:
    tags:
      - "catalog-v*"
  workflow_dispatch:
    inputs:
      catalog_version:
        description: Catalog version to publish.
        required: true
        default: 1.4.0

permissions:
  contents: read

jobs:
  validate-publish:
    name: Validate and publish content catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve catalog version
        id: catalog-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            CATALOG_VERSION="${GITHUB_REF_NAME#catalog-v}"
          else
            CATALOG_VERSION="${{ inputs.catalog_version }}"
          fi

          if [[ ! "${CATALOG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid catalog version: ${CATALOG_VERSION}" >&2
            exit 1
          fi

          DECLARED_VERSION="$(jq -r '.catalogVersion' catalog/content-package-catalog.json)"
          if [[ "${DECLARED_VERSION}" != "${CATALOG_VERSION}" ]]; then
            echo "Catalog declares ${DECLARED_VERSION}, workflow requested ${CATALOG_VERSION}." >&2
            exit 1
          fi

          echo "catalog_version=${CATALOG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=catalog-v${CATALOG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LevelUp.NavTableUpdater.slnx

      - name: Validate catalog with the production parser
        run: >
          dotnet test tests/LevelUp.NavTableUpdater.Core.Tests/LevelUp.NavTableUpdater.Core.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~ContentPatchCatalogTests|FullyQualifiedName~ContentPackageCatalogLoaderTests"
          --verbosity normal

      - name: Prepare immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/catalog
          cp catalog/content-package-catalog.json artifacts/catalog/content-package-catalog.json
          cp catalog/content-package-catalog.schema.json artifacts/catalog/content-package-catalog.schema.json
          (
            cd artifacts/catalog
            shasum -a 256 content-package-catalog.json content-package-catalog.schema.json > catalog-SHA256SUMS.txt
          )

      - name: Create or update catalog release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.catalog-version.outputs.tag }}
          CATALOG_VERSION: ${{ steps.catalog-version.outputs.catalog_version }}
        run: |
          set -euo pipefail

          NOTES="Versioned content package catalog for the X-Plane 737NG Maintenance Toolkit. This release changes package discovery metadata only and is not an application release."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Toolkit Content Catalog ${CATALOG_VERSION}" \
              --notes "${NOTES}" \
              --latest=false
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Toolkit Content Catalog ${CATALOG_VERSION}" \
              --notes "${NOTES}" \
              --latest=false
          fi

          gh release upload "${TAG}" artifacts/catalog/* --clobber
